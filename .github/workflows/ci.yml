name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskboard" --health-interval 2s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://taskboard:taskboard@localhost:5432/taskboard_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy app tests
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check && alembic downgrade base
      - name: Test
        run: pytest
